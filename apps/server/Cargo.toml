[package]
name = "operalibre-server"
version = "0.2.6"
edition = "2024"
# Locked dependencies require 1.89 (aes 0.9.3, lofty 0.25.4, and related crates).
rust-version = "1.89"
license-file = "../../LICENSE.md"

[dependencies]
anyhow = "1.0"
argon2 = "0.6"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
fs2 = "0.4"
rand = "0.10"
same-file = "1.0"
id3 = "1.16"
lofty = "0.25.1"
lopdf = { version = "0.46", default-features = false }
mime_guess = "2.0"
mp4ameta = "0.13"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
semver = "1.0"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
rayon = "1.11"
# Session timestamps use checked u64/SQLite INTEGER conversions.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
# Outbound TLS keeps rustls on ring with the bundled Mozilla roots; see
# `http_client_builder`.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tower-http = { version = "0.7", features = ["compression-gzip", "cors", "fs", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
ed25519-dalek = "3"
flate2 = "1"
tar = { version = "0.4", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1.45", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
