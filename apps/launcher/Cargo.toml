[package]
name = "operalibre-launcher"
version = "0.5.1"
edition = "2024"
# `File::lock` stabilized in 1.89. `let` chains in this crate need 1.88.
rust-version = "1.89"
license-file = "../../LICENSE.md"

[dependencies]
# Snapshots the database before an update swaps the server, so a rollback can
# hand the previous build data it still reads. Same version as the server's.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
