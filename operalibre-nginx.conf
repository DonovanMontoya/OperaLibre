# This file is intended to be included from nginx's `http` context (for
# example through sites-enabled). Replace the hostname and certificate paths.

limit_req_zone $binary_remote_addr zone=operalibre_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=operalibre_connections:10m;

# Deliberately log $uri, not $request or $request_uri: media credentials are
# query parameters and must never be written to an access log.
log_format operalibre '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name books.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name books.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/books.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/books.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/operalibre-access.log operalibre;
    limit_conn operalibre_connections 20;
    client_body_timeout 30s;
    send_timeout 1h;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: http: https:; connect-src 'self' http: https:; frame-src 'self' data: blob:; worker-src 'self' blob:; form-action 'self'" always;

    root /srv/OperaLibre/apps/web/dist;
    index index.html;

    # Authentication is additionally throttled at the public edge. The Rust
    # server applies account and trusted-loopback-proxy IP limits as well.
    location = /api/auth/login {
        limit_req zone=operalibre_login burst=5 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Large request bodies are permitted only on the authenticated uploader.
    location = /api/library/upload {
        client_max_body_size 20g;
        client_body_timeout 5m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
    }

    # Restoring a backup posts the whole archive; the server accepts up to
    # 256 MiB there, so do not let the general /api/ ceiling cut it short.
    location = /api/admin/backup {
        client_max_body_size 256m;
        client_body_timeout 5m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10m;
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # The Audiobookshelf-compatible login shares the server's login throttle
    # with /api/auth/login, so it gets the same edge limit.
    location = /abs/login {
        limit_req zone=operalibre_login burst=5 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Audiobookshelf-compatible API used by third-party apps. It lives
    # outside /api/, so without this block it would fall through to the SPA.
    location /abs/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
