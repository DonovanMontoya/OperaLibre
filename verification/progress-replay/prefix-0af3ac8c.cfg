\* The server before 0af3ac8c: no recording lineage. While a save's reply is
\* in flight or lost, later edits keep the old base and the server refuses
\* them. Must violate NoOrphanedEdit; the shortest path has the reply in
\* flight. prefix-0af3ac8c-lost-reply.cfg requires the reply to be lost.
SPECIFICATION Spec
CONSTANTS
    RecordingLineage = FALSE
    AdoptHealedJournal = TRUE
    AdoptHealedOnLostResend = TRUE
    PreferNewestOnLostResend = TRUE
    GuardUnrestoredSave = TRUE
    MaxLoads = 2
    MaxEdits = 2
    MaxLosses = 1
    MaxOtherSaves = 1
INVARIANTS
    NoOrphanedEdit
