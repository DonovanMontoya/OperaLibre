\* 0af3ac8c as reported: restore's save commits, its reply is lost, restore
\* finishes, and the next autosave is refused for its old base.
\* Must violate NoOrphanAfterLostReply.
SPECIFICATION Spec
CONSTANTS
    RecordingLineage = FALSE
    AdoptHealedJournal = TRUE
    AdoptHealedOnLostResend = TRUE
    GuardUnrestoredSave = TRUE
    MaxLoads = 2
    MaxEdits = 2
    MaxLosses = 1
INVARIANTS
    NoOrphanAfterLostReply
