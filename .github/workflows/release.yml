name: Create Release

on:
  # Nightlies are started by nightly.yml shortly after 8:17 p.m. Eastern.
  repository_dispatch:
    types: [nightly]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (nightly publishes only web/server packages)
        type: choice
        options: [stable, nightly]
        default: stable
      source_nightly:
        description: Optional immutable nightly tag to promote to stable
        type: string
        default: ""
      tag:
        description: Version tag to create or rebuild; leave blank to increment the latest release patch
        required: false
        default: ""
        type: string
      release_notes:
        description: Optional Markdown summary to include at the top of the GitHub Release notes
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Requested release
    uses: ./.github/workflows/build-release.yml
    with:
      channel: ${{ github.event_name == 'repository_dispatch' && 'nightly' || inputs.channel || 'stable' }}
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || '' }}
      source_nightly: ${{ inputs.source_nightly || '' }}
      release_notes: ${{ inputs.release_notes || '' }}
      release_event: ${{ github.event_name }}
    secrets: inherit
    permissions:
      contents: write
      checks: write
      id-token: write
      attestations: write

  # Keep both channels in this run so the release lock covers publication
  # and queued manual releases cannot be displaced by a nightly dispatch.
  nightly:
    name: Nightly from stable source
    needs: release
    if: github.event_name != 'repository_dispatch' && inputs.channel != 'nightly'
    uses: ./.github/workflows/build-release.yml
    with:
      channel: nightly
      source_sha: ${{ needs.release.outputs.ref }}
      release_event: workflow_dispatch
    secrets: inherit
    permissions:
      contents: write
      checks: write
      id-token: write
      attestations: write
