name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create or rebuild; leave blank to increment the latest release patch
        required: false
        default: ""
        type: string
      release_notes:
        description: Optional Markdown summary to include at the top of the GitHub Release notes
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || 'next-patch') || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
      ref: ${{ steps.release-ref.outputs.ref }}
      tag_exists: ${{ steps.release-ref.outputs.tag_exists }}
      sync_version: ${{ steps.sync-addon.outputs.version }}
      sync_inputs: ${{ steps.sync-addon.outputs.inputs }}
      sync_needed: ${{ steps.sync-addon.outputs.needed }}
    steps:
      - name: Resolve release tag and source
        id: release-ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="$(sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' <<< "${REQUESTED_TAG}")"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ -z "${release_tag}" ]]; then
            latest_tag="$({
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
            } | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"

            if [[ -z "${latest_tag}" ]]; then
              release_tag="0.1.0"
            else
              IFS=. read -r major minor patch <<< "${latest_tag}"
              release_tag="${major}.${minor}.$((patch + 1))"
            fi
          fi

          if [[ ! "${release_tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version such as 0.2.4 or v0.2.4." >&2
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
            echo "ref=${release_tag}" >> "${GITHUB_OUTPUT}"
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release-ref.outputs.ref }}

      # The read-along sync add-on is several hundred megabytes per platform
      # and rarely changes, so it has its own release per add-on version
      # (readalong-sync-v<version>) instead of riding along in every app
      # release. It is built only when that release is missing or incomplete.
      - name: Check sync add-on release
        id: sync-addon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./addons/readalong-sync/package.json").version')"
          tag="readalong-sync-v${version}"
          inputs="$(cat addons/readalong-sync/package.json addons/readalong-sync/package-lock.json \
            script/package_sync_addon.mjs | sha256sum | cut -d' ' -f1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "inputs=${inputs}" >> "${GITHUB_OUTPUT}"

          if ! release="$(gh release view "${tag}" --json body,assets)"; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! jq -e --arg inputs "Inputs: sha256:${inputs}" '.body | contains($inputs)' <<< "${release}" >/dev/null; then
            echo "The sync add-on changed since ${tag} was published. Bump the version in" >&2
            echo "addons/readalong-sync/package.json and SYNC_ADDON_VERSION in apps/server/src/updates.rs." >&2
            exit 1
          fi
          packages="$(jq '[.assets[].name | select(test("^operalibre-readalong-sync-.+\\.zip(\\.sig)?$"))] | length' <<< "${release}")"
          if [[ "${packages}" -eq 10 ]]; then
            echo "needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          fi

  verify:
    name: Verify release source
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Require a commit from main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release source must be a commit in main history." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Verify optional sync add-on dependencies
        run: |
          npm ci --prefix addons/readalong-sync --ignore-scripts
          npm audit --prefix addons/readalong-sync --omit=dev --audit-level=low

      - name: Test and build web app
        run: |
          npm test -w @operalibre/web
          npm run build -w @operalibre/web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Verify Rust components
        run: |
          cargo fmt --check --manifest-path apps/server/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path apps/server/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path apps/server/Cargo.toml
          cargo fmt --check --manifest-path apps/launcher/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path apps/launcher/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path apps/launcher/Cargo.toml

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit server dependencies
        run: cargo audit --file apps/server/Cargo.lock

      - name: Audit launcher dependencies
        run: cargo audit --file apps/launcher/Cargo.lock

  frontend:
    name: Frontend package
    needs:
      - prepare
      - verify
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -w @operalibre/web

      - name: Build frontend
        run: npm run build -w @operalibre/web
        env:
          OPERALIBRE_VERSION: ${{ env.RELEASE_TAG }}

      - name: Stage frontend package
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          package="operalibre-${version}-frontend"
          node script/package_release.mjs \
            --kind frontend \
            --web apps/web/dist \
            --output "staging/${package}" \
            --version "${version}"
          mkdir -p dist
          cd staging
          zip -qr "../dist/${package}.zip" "${package}"

      - name: Upload built frontend for native packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

      - name: Upload frontend release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-frontend
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK (unsigned)
    needs:
      - prepare
      - frontend
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Download built frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: apps/web/dist

      - name: Sync Android project
        run: npx cap sync android
        working-directory: apps/web

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease
        working-directory: apps/web/android

      - name: Stage Android release package
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "dist/operalibre-${version}-android-unsigned.apk"

      - name: Upload Android release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  native:
    name: ${{ matrix.platform }} packages
    needs:
      - prepare
      - frontend
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            executable: apps/server/target/release/operalibre-server
            launcher: apps/launcher/target/release/operalibre-launcher
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            executable: apps/server/target/release/operalibre-server
            launcher: apps/launcher/target/release/operalibre-launcher
          - platform: macos-x64
            runner: macos-15-intel
            executable: apps/server/target/release/operalibre-server
            launcher: apps/launcher/target/release/operalibre-launcher
          - platform: macos-arm64
            runner: macos-15
            executable: apps/server/target/release/operalibre-server
            launcher: apps/launcher/target/release/operalibre-launcher
          - platform: windows-x64
            runner: windows-latest
            executable: apps/server/target/release/operalibre-server.exe
            launcher: apps/launcher/target/release/operalibre-launcher.exe
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/server
          shared-key: release-${{ matrix.platform }}

      - name: Setup Node for packaging
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Download built frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: web-dist

      - name: Build server
        run: cargo build --release --locked --manifest-path apps/server/Cargo.toml
        env:
          OPERALIBRE_VERSION: ${{ env.RELEASE_TAG }}

      - name: Build background launcher
        run: cargo build --release --locked --manifest-path apps/launcher/Cargo.toml

      - name: Package for Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          server_package="operalibre-${version}-server-${{ matrix.platform }}"
          combined_package="operalibre-${version}-combined-${{ matrix.platform }}"
          update_package="operalibre-${version}-update-${{ matrix.platform }}"

          node script/package_release.mjs \
            --kind server \
            --platform "${{ matrix.platform }}" \
            --binary "${{ matrix.executable }}" \
            --launcher "${{ matrix.launcher }}" \
            --output "staging/${server_package}" \
            --version "${version}"

          node script/package_release.mjs \
            --kind combined \
            --platform "${{ matrix.platform }}" \
            --binary "${{ matrix.executable }}" \
            --launcher "${{ matrix.launcher }}" \
            --web web-dist \
            --output "staging/${combined_package}" \
            --version "${version}"

          node script/package_release.mjs \
            --kind update \
            --platform "${{ matrix.platform }}" \
            --binary "${{ matrix.executable }}" \
            --launcher "${{ matrix.launcher }}" \
            --web web-dist \
            --output "staging/${update_package}" \
            --version "${version}"

          mkdir -p dist
          tar -C staging -czf "dist/${server_package}.tar.gz" "${server_package}"
          tar -C staging -czf "dist/${combined_package}.tar.gz" "${combined_package}"
          (cd staging && zip -qr "../dist/${update_package}.zip" "${update_package}")

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $serverPackage = "operalibre-$version-server-${{ matrix.platform }}"
          $combinedPackage = "operalibre-$version-combined-${{ matrix.platform }}"
          $updatePackage = "operalibre-$version-update-${{ matrix.platform }}"

          node script/package_release.mjs `
            --kind server `
            --platform "${{ matrix.platform }}" `
            --binary "${{ matrix.executable }}" `
            --output "staging/$serverPackage" `
            --version "$version"

          node script/package_release.mjs `
            --kind combined `
            --platform "${{ matrix.platform }}" `
            --binary "${{ matrix.executable }}" `
            --launcher "${{ matrix.launcher }}" `
            --web web-dist `
            --output "staging/$combinedPackage" `
            --version "$version"

          node script/package_release.mjs `
            --kind update `
            --platform "${{ matrix.platform }}" `
            --binary "${{ matrix.executable }}" `
            --launcher "${{ matrix.launcher }}" `
            --web web-dist `
            --output "staging/$updatePackage" `
            --version "$version"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "staging/$serverPackage" -DestinationPath "dist/$serverPackage.zip"
          Compress-Archive -Path "staging/$combinedPackage" -DestinationPath "dist/$combinedPackage.zip"
          Compress-Archive -Path "staging/$updatePackage" -DestinationPath "dist/$updatePackage.zip"

      - name: Upload native release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  sync-addon:
    name: ${{ matrix.platform }} sync add-on
    needs:
      - prepare
      - verify
    if: needs.prepare.outputs.sync_needed == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      SYNC_VERSION: ${{ needs.prepare.outputs.sync_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install sync add-on runtime
        run: npm ci --prefix addons/readalong-sync

      - name: Package for Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="operalibre-readalong-sync-${SYNC_VERSION}-${{ matrix.platform }}"
          node script/package_sync_addon.mjs \
            --platform "${{ matrix.platform }}" \
            --output "staging/${package}" \
            --version "${SYNC_VERSION}"
          mkdir -p dist
          (cd staging && zip -qr "../dist/${package}.zip" "${package}")

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "operalibre-readalong-sync-$env:SYNC_VERSION-${{ matrix.platform }}"
          node script/package_sync_addon.mjs `
            --platform "${{ matrix.platform }}" `
            --output "staging/$package" `
            --version "$env:SYNC_VERSION"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "staging/$package" -DestinationPath "dist/$package.zip"

      - name: Upload sync add-on package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish-sync-addon:
    name: Publish sync add-on release
    needs:
      - prepare
      - sync-addon
    runs-on: ubuntu-24.04
    env:
      SYNC_VERSION: ${{ needs.prepare.outputs.sync_version }}
      SYNC_TAG: readalong-sync-v${{ needs.prepare.outputs.sync_version }}
      SYNC_INPUTS: ${{ needs.prepare.outputs.sync_inputs }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Checkout release signing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-signing-tools
          sparse-checkout: script/release_signing.mjs

      - name: Download sync add-on packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sync-*
          path: sync-assets
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # The server refuses an add-on package without a valid .sig for this tag.
      - name: Sign sync add-on packages
        shell: bash
        env:
          OPERALIBRE_RELEASE_SIGNING_KEY: ${{ secrets.OPERALIBRE_RELEASE_SIGNING_KEY }}
        run: node release-signing-tools/script/release_signing.mjs sign sync-assets "${SYNC_TAG}"

      - name: Attest sync add-on packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sync-assets/*

      # Never "latest": servers find the app update through releases/latest.
      - name: Create or update sync add-on release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Optional read-along sync add-on ${SYNC_VERSION}. OperaLibre servers install it from"
            echo "**Administration**; you do not need to download these files yourself. It is"
            echo "published separately from app releases because it changes much less often."
            echo
            echo "Inputs: sha256:${SYNC_INPUTS}"
          } > sync-notes.md
          title="OperaLibre read-along sync add-on ${SYNC_VERSION}"
          if gh release view "${SYNC_TAG}" >/dev/null 2>&1; then
            gh release upload "${SYNC_TAG}" sync-assets/* --clobber
            gh release edit "${SYNC_TAG}" --title "${title}" --notes-file sync-notes.md --latest=false
          else
            gh release create "${SYNC_TAG}" sync-assets/* \
              --target "$(git rev-parse HEAD)" \
              --latest=false \
              --title "${title}" \
              --notes-file sync-notes.md
          fi

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - frontend
      - android
      - native
      - publish-sync-addon
    # Runs when the sync add-on release was already published and its jobs
    # were skipped, but never after any failure.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_DESCRIPTION: ${{ inputs.release_notes }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      # A rebuilt tag can predate release signing. Use the signer from the
      # workflow revision while keeping the packages tied to the release tag.
      - name: Checkout release signing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-signing-tools
          sparse-checkout: script/release_signing.mjs

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # Servers and the macOS app refuse any update without a valid .sig from
      # this key, and the script fails when the secret is missing, so an
      # unsigned release cannot be published.
      - name: Sign release packages
        shell: bash
        env:
          OPERALIBRE_RELEASE_SIGNING_KEY: ${{ secrets.OPERALIBRE_RELEASE_SIGNING_KEY }}
        run: node release-signing-tools/script/release_signing.mjs sign release-assets "${RELEASE_TAG}"

      # Every server since 0.1.2 updates itself by fetching these exact names
      # from the latest release (0.4.5 and later also need the .sig), and the
      # macOS app fetches the frontend package. A release without any of them
      # would strand those installs, so refuse to publish it.
      - name: Check packages that existing installs update from
        shell: bash
        working-directory: release-assets
        run: |
          version="${RELEASE_TAG#v}"
          missing=0
          for name in "operalibre-${version}-frontend.zip" \
            operalibre-"${version}"-update-{linux-x64,linux-arm64,macos-x64,macos-arm64,windows-x64}.zip; do
            for file in "${name}" "${name}.sig"; do
              if [[ ! -s "${file}" ]]; then
                echo "Missing ${file}, which existing installations update from." >&2
                missing=1
              fi
            done
          done
          exit "${missing}"

      - name: Create checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Attest release packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Build release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "## What's changed"
            echo
            if [[ -n "${RELEASE_DESCRIPTION//[[:space:]]/}" ]]; then
              printf '%s\n\n' "${RELEASE_DESCRIPTION}"
            fi
            if [[ -n "${previous_tag}" ]]; then
              git log --reverse --no-merges --pretty='- %s (`%h`)' "${previous_tag}..HEAD"
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
            else
              git log --reverse --no-merges --pretty='- %s (`%h`)' HEAD
            fi
            echo
            cat release/RELEASE_NOTES.md
          } > release/RELEASE_BODY.md

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="OperaLibre ${RELEASE_TAG}"
          if [[ "${{ needs.prepare.outputs.tag_exists }}" != "true" ]]; then
            git tag "${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${title}" \
              --notes-file release/RELEASE_BODY.md
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --verify-tag \
              --title "${title}" \
              --notes-file release/RELEASE_BODY.md
          fi
