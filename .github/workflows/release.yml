name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create or rebuild; leave blank to increment the latest release patch
        required: false
        default: ""
        type: string
      release_notes:
        description: Optional Markdown summary to include at the top of the GitHub Release notes
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || 'next-patch') || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
      ref: ${{ steps.release-ref.outputs.ref }}
      tag_exists: ${{ steps.release-ref.outputs.tag_exists }}
    steps:
      - name: Resolve release tag and source
        id: release-ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="$(sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' <<< "${REQUESTED_TAG}")"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ -z "${release_tag}" ]]; then
            latest_tag="$({
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
            } | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"

            if [[ -z "${latest_tag}" ]]; then
              release_tag="0.1.0"
            else
              IFS=. read -r major minor patch <<< "${latest_tag}"
              release_tag="${major}.${minor}.$((patch + 1))"
            fi
          fi

          if [[ ! "${release_tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version such as 0.2.4 or v0.2.4." >&2
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
            echo "ref=${release_tag}" >> "${GITHUB_OUTPUT}"
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi

  verify:
    name: Verify release source
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Require a commit from main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release source must be a commit in main history." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Test and build web app
        run: |
          npm test -w @operalibre/web
          npm run build -w @operalibre/web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Verify Rust components
        run: |
          cargo fmt --check --manifest-path apps/server/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path apps/server/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path apps/server/Cargo.toml
          cargo fmt --check --manifest-path apps/launcher/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path apps/launcher/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path apps/launcher/Cargo.toml

      - name: Audit server dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, Node.js 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/server

      - name: Audit launcher dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, Node.js 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/launcher

  frontend:
    name: Frontend package
    needs:
      - prepare
      - verify
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -w @operalibre/web

      - name: Build frontend
        run: npm run build -w @operalibre/web
        env:
          OPERALIBRE_VERSION: ${{ env.RELEASE_TAG }}

      - name: Stage frontend package
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          package="operalibre-${version}-frontend"
          node script/package_release.mjs \
            --kind frontend \
            --web apps/web/dist \
            --output "staging/${package}" \
            --version "${version}"
          mkdir -p dist
          cd staging
          zip -qr "../dist/${package}.zip" "${package}"

      - name: Upload built frontend for native packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

      - name: Upload frontend release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-frontend
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK (unsigned)
    needs:
      - prepare
      - frontend
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Download built frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: apps/web/dist

      - name: Sync Android project
        run: npx cap sync android
        working-directory: apps/web

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease
        working-directory: apps/web/android

      - name: Stage Android release package
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "dist/operalibre-${version}-android-unsigned.apk"

      - name: Upload Android release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  native:
    name: ${{ matrix.platform }} packages
    needs:
      - prepare
      - frontend
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            executable: apps/server/target/release/operalibre-server
            launcher: apps/launcher/target/release/operalibre-launcher
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            executable: apps/server/target/release/operalibre-server
            launcher: apps/launcher/target/release/operalibre-launcher
          - platform: macos-x64
            runner: macos-15-intel
            executable: apps/server/target/release/operalibre-server
            launcher: apps/launcher/target/release/operalibre-launcher
          - platform: macos-arm64
            runner: macos-15
            executable: apps/server/target/release/operalibre-server
            launcher: apps/launcher/target/release/operalibre-launcher
          - platform: windows-x64
            runner: windows-latest
            executable: apps/server/target/release/operalibre-server.exe
            launcher: apps/launcher/target/release/operalibre-launcher.exe
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/server
          shared-key: release-${{ matrix.platform }}

      - name: Setup Node for packaging
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Download built frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: web-dist

      - name: Build server
        run: cargo build --release --locked --manifest-path apps/server/Cargo.toml
        env:
          OPERALIBRE_VERSION: ${{ env.RELEASE_TAG }}

      - name: Build background launcher
        run: cargo build --release --locked --manifest-path apps/launcher/Cargo.toml

      - name: Package for Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          server_package="operalibre-${version}-server-${{ matrix.platform }}"
          combined_package="operalibre-${version}-combined-${{ matrix.platform }}"
          update_package="operalibre-${version}-update-${{ matrix.platform }}"

          node script/package_release.mjs \
            --kind server \
            --platform "${{ matrix.platform }}" \
            --binary "${{ matrix.executable }}" \
            --output "staging/${server_package}" \
            --version "${version}"

          node script/package_release.mjs \
            --kind combined \
            --platform "${{ matrix.platform }}" \
            --binary "${{ matrix.executable }}" \
            --launcher "${{ matrix.launcher }}" \
            --web web-dist \
            --output "staging/${combined_package}" \
            --version "${version}"

          node script/package_release.mjs \
            --kind update \
            --platform "${{ matrix.platform }}" \
            --binary "${{ matrix.executable }}" \
            --launcher "${{ matrix.launcher }}" \
            --web web-dist \
            --output "staging/${update_package}" \
            --version "${version}"

          mkdir -p dist
          tar -C staging -czf "dist/${server_package}.tar.gz" "${server_package}"
          tar -C staging -czf "dist/${combined_package}.tar.gz" "${combined_package}"
          (cd staging && zip -qr "../dist/${update_package}.zip" "${update_package}")

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $serverPackage = "operalibre-$version-server-${{ matrix.platform }}"
          $combinedPackage = "operalibre-$version-combined-${{ matrix.platform }}"
          $updatePackage = "operalibre-$version-update-${{ matrix.platform }}"

          node script/package_release.mjs `
            --kind server `
            --platform "${{ matrix.platform }}" `
            --binary "${{ matrix.executable }}" `
            --output "staging/$serverPackage" `
            --version "$version"

          node script/package_release.mjs `
            --kind combined `
            --platform "${{ matrix.platform }}" `
            --binary "${{ matrix.executable }}" `
            --launcher "${{ matrix.launcher }}" `
            --web web-dist `
            --output "staging/$combinedPackage" `
            --version "$version"

          node script/package_release.mjs `
            --kind update `
            --platform "${{ matrix.platform }}" `
            --binary "${{ matrix.executable }}" `
            --launcher "${{ matrix.launcher }}" `
            --web web-dist `
            --output "staging/$updatePackage" `
            --version "$version"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "staging/$serverPackage" -DestinationPath "dist/$serverPackage.zip"
          Compress-Archive -Path "staging/$combinedPackage" -DestinationPath "dist/$combinedPackage.zip"
          Compress-Archive -Path "staging/$updatePackage" -DestinationPath "dist/$updatePackage.zip"

      - name: Upload native release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - frontend
      - android
      - native
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_DESCRIPTION: ${{ inputs.release_notes }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Attest release packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Build release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "## What's changed"
            echo
            if [[ -n "${RELEASE_DESCRIPTION//[[:space:]]/}" ]]; then
              printf '%s\n\n' "${RELEASE_DESCRIPTION}"
            fi
            if [[ -n "${previous_tag}" ]]; then
              git log --reverse --no-merges --pretty='- %s (`%h`)' "${previous_tag}..HEAD"
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
            else
              git log --reverse --no-merges --pretty='- %s (`%h`)' HEAD
            fi
            echo
            cat release/RELEASE_NOTES.md
          } > release/RELEASE_BODY.md

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="OperaLibre ${RELEASE_TAG}"
          if [[ "${{ needs.prepare.outputs.tag_exists }}" != "true" ]]; then
            git tag "${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${title}" \
              --notes-file release/RELEASE_BODY.md
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --verify-tag \
              --title "${title}" \
              --notes-file release/RELEASE_BODY.md
          fi
