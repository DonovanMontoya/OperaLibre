name: Security audits

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/security.yml"
      - "apps/server/Cargo.toml"
      - "apps/server/Cargo.lock"
      - "apps/launcher/Cargo.toml"
      - "apps/launcher/Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
  pull_request:
    paths:
      - ".github/workflows/security.yml"
      - "apps/server/Cargo.toml"
      - "apps/server/Cargo.lock"
      - "apps/launcher/Cargo.toml"
      - "apps/launcher/Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Only obsolete PR runs are cancelled; main, scheduled and manual runs are unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: RustSec (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            directory: apps/server
          - component: launcher
            directory: apps/launcher
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Audit Rust dependencies
        working-directory: ${{ matrix.directory }}
        run: cargo audit --deny unsound

  web:
    name: Production npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: low
          fail-on-scopes: runtime
