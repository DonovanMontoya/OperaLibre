name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

# Only obsolete PR runs are cancelled; main, scheduled and manual runs are unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.select.outputs.server }}
      server_windows: ${{ steps.select.outputs.server_windows }}
      launcher: ${{ steps.select.outputs.launcher }}
      web: ${{ steps.select.outputs.web }}
      playback: ${{ steps.select.outputs.playback }}
      android: ${{ steps.select.outputs.android }}
      apple: ${{ steps.select.outputs.apple }}
      carplay: ${{ steps.select.outputs.carplay }}
      bookplayer: ${{ steps.select.outputs.bookplayer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test change selection
        run: python3 -m unittest discover -s script/ci -p 'test_*.py'
      - name: Select checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 script/ci/select_checks.py

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/server

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
        env:
          OPERALIBRE_GIFT_HTTP_INVENTORY_FIXTURE: ${{ runner.temp }}/gift-inventory.json
          OPERALIBRE_GIFT_METADATA_FIXTURE: ${{ runner.temp }}/gift-metadata.json
          OPERALIBRE_GIFT_NATIVE_ARCHIVE_FIXTURE: ${{ runner.temp }}/gift-native.zip.json
          OPERALIBRE_GIFT_ALIGNMENT_ARCHIVE_FIXTURE: ${{ runner.temp }}/gift-alignment.zip.json
          OPERALIBRE_PEER_FIXTURE_PATH: ${{ runner.temp }}/gift-peer-offer.json
          OPERALIBRE_PREVIEW_FIXTURE_PATH: ${{ runner.temp }}/gift-preview.json
          OPERALIBRE_COVER_PREVIEW_FIXTURE: ${{ runner.temp }}/gift-cover.json

      - name: Setup Node for cross-runtime gift contracts
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for server ZIP interoperability
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Test actual Worker, peer recovery and recipient contracts
        working-directory: ${{ github.workspace }}
        env:
          OPERALIBRE_WORKER_FIXTURE_SCRIPT: ${{ github.workspace }}/share-broker/test/node-fixture-server.mjs
          OPERALIBRE_GIFT_HTTP_INVENTORY_FIXTURE: ${{ runner.temp }}/gift-inventory.json
          OPERALIBRE_GIFT_METADATA_FIXTURE: ${{ runner.temp }}/gift-metadata.json
          OPERALIBRE_GIFT_ALIGNMENT_ARCHIVE_FIXTURE: ${{ runner.temp }}/gift-alignment.zip.json
          OPERALIBRE_PEER_FIXTURE_PATH: ${{ runner.temp }}/gift-peer-offer.json
          OPERALIBRE_PREVIEW_FIXTURE_PATH: ${{ runner.temp }}/gift-preview.json
          OPERALIBRE_COVER_PREVIEW_FIXTURE: ${{ runner.temp }}/gift-cover.json
        run: |
          npm ci
          npx tsc -p share-broker/tsconfig.test.json
          cargo test --locked --manifest-path apps/server/Cargo.toml retained_invitation_recovers_with_actual_worker_and_real_recipient_peer -- --ignored --nocapture
          cargo test --locked --manifest-path apps/server/Cargo.toml selected_sender_survives_full_process_restart -- --ignored --nocapture
          node --experimental-strip-types --test apps/web/test/giftInventoryHttpContract.test.ts apps/web/test/giftMetadata.test.ts apps/web/test/giftLocalSync.test.ts apps/web/test/giftSignedPreview.test.ts apps/web/test/giftPeerAuthentication.test.ts

      - name: Test actual selected server ZIPs with native host extractor
        working-directory: ${{ github.workspace }}
        run: |
          OPERALIBRE_GIFT_NATIVE_ARCHIVE_FIXTURE="$RUNNER_TEMP/gift-native.zip.json" node --test script/test_gift_server_archive.mjs
          OPERALIBRE_GIFT_NATIVE_ARCHIVE_FIXTURE="$RUNNER_TEMP/gift-alignment.zip.json" node --test script/test_gift_server_archive.mjs

      - name: Test actual selected EPUB in standalone reader
        working-directory: ${{ github.workspace }}
        env:
          OPERALIBRE_GIFT_ALIGNMENT_ARCHIVE_FIXTURE: ${{ runner.temp }}/gift-alignment.zip.json
        run: |
          npx playwright install --with-deps chromium
          node script/test_book_gifts.mjs --local-reader-only

      - name: Upload actual gift reader fixture screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operalibre-gift-cross-runtime
          path: output/book-gifts/gift-local-readalong-*.png
          retention-days: 7
          if-no-files-found: ignore

  server-windows:
    needs: changes
    if: needs.changes.outputs.server_windows == 'true'
    name: Server Windows (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/server

      - name: Compile Windows server
        run: cargo check --locked

      - name: Test Windows Libation job cleanup
        run: cargo test --locked libation_download::windows_tests -- --nocapture

      - name: Test Windows gift selected-file denial boundary
        run: cargo test --locked share::windows_open::tests -- --nocapture

  launcher:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    name: Release launcher (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test managed update handoff on Linux
        run: |
          cargo build --locked
          python3 ../../script/test_managed_handoff.py target/debug/operalibre-launcher

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Test release packaging
        run: |
          node --test script/file-picker/patch.test.mjs
          node --test script/package_release.test.mjs
          node --test script/release_signing.test.mjs
          node --test script/resolve_release.test.mjs
          node --test script/publish_release.test.mjs
          node --test script/version.test.mjs
          node script/version.mjs check
          python3 script/test_installer_libation.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @operalibre/web

      - name: Test
        run: npm test -w @operalibre/web

      - name: Test book gifting broker
        run: npm run test:broker

      - name: Test development proxy
        run: node --experimental-strip-types --test script/dev_proxy.test.mjs

      - name: Test performance runner
        run: node --test script/performance/run.test.mjs

      - name: Test browser lifecycle without the server
        run: |
          npx playwright install --with-deps chromium
          npm run test:lifecycle -w @operalibre/web -- --project=browser

      - name: Test experimental gift browser integration
        run: npm run test:book-gifts

      - name: Upload gift fixture screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operalibre-book-gifts
          path: output/book-gifts/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload cover editor screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operalibre-cover-editor
          path: output/lifecycle/**/mobile-cover-editor.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: npm run build -w @operalibre/web

      - name: Upload web lifecycle output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operalibre-web-lifecycle-output
          path: output/lifecycle
          retention-days: 7
          if-no-files-found: ignore

  playback:
    needs: changes
    if: needs.changes.outputs.playback == 'true'
    name: Playback lifecycle (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/server

      - name: Install dependencies
        run: npm ci

      - name: Build server
        run: cargo build --locked --manifest-path apps/server/Cargo.toml

      - name: Build web app
        run: npm run build -w @operalibre/web

      - name: Test playback progress, queue, and reconnect
        run: |
          npx playwright install --with-deps chromium
          npm run test:lifecycle -w @operalibre/web -- --project=server

      - name: Upload lifecycle output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operalibre-playback-lifecycle-output
          path: output/lifecycle
          retention-days: 7
          if-no-files-found: ignore

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    name: Android APK (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned release APK
        run: npm run build:android -- release

      - name: Test staged gift extraction on the JVM
        run: |
          gift_test_dir="$(mktemp -d "$RUNNER_TEMP/operalibre-gift-extractor.XXXXXX")"
          javac -d "$gift_test_dir" \
            apps/web/android/app/src/main/java/com/operalibre/mobile/GiftArchiveExtractor.java \
            apps/web/android/tests/GiftArchiveExtractorTest.java \
            apps/web/android/tests/GiftLargeZip64InteropTest.java \
            apps/web/android/app/src/main/java/com/operalibre/mobile/GiftDocumentLifecycle.java \
            apps/web/android/tests/GiftDocumentLifecycleTest.java \
            apps/web/android/tests/GiftAndroidPublicApiTest.java
          java -cp "$gift_test_dir" GiftArchiveExtractorTest
          java -cp "$gift_test_dir" com.operalibre.mobile.GiftDocumentLifecycleTest
          java -cp "$gift_test_dir" GiftAndroidPublicApiTest

      - name: Test Android download policy
        run: cd apps/web/android && ./gradlew testDebugUnitTest

      - name: Upload unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operalibre-android-unsigned-apk
          path: apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    name: Apple build and policies
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        run: swift build

      - name: Test release signature verification
        run: |
          swiftc apps/macos/Sources/OperaLibre/ReleaseSignature.swift apps/macos/Tests/ReleaseSignatureTests.swift -o "$RUNNER_TEMP/release-signature-tests"
          "$RUNNER_TEMP/release-signature-tests"

      - name: Test iOS export compliance declaration
        run: |
          python3 script/test_ios_export_compliance.py
          sh script/check_ios_export_compliance.sh apps/web/ios/App/App/Info.plist

      - name: Test iOS background download policy
        run: |
          swiftc apps/web/ios/App/App/BackgroundDownloadPolicy.swift apps/web/ios/Tests/BackgroundDownloadPolicyTests.swift -o "$RUNNER_TEMP/background-policy-tests"
          "$RUNNER_TEMP/background-policy-tests"

      - name: Test background download manager recovery
        run: python3 script/test_background_download_manager.py

      - name: Test iOS Libro response decoding
        run: |
          swiftc apps/web/ios/App/App/LibroDeviceResponse.swift apps/web/ios/Tests/LibroDeviceResponseTests.swift -o "$RUNNER_TEMP/libro-response-tests"
          "$RUNNER_TEMP/libro-response-tests"

      - name: Test iOS CarPlay resume position
        run: |
          swiftc apps/web/ios/App/App/CarLibrary.swift apps/web/ios/App/App/StoredRecords.swift apps/web/ios/Tests/CarLibraryTests.swift -o "$RUNNER_TEMP/car-library-tests"
          "$RUNNER_TEMP/car-library-tests"

      - name: Test simulator runtime selection
        run: python3 script/test_simulator_runtime.py

      # Compile the otherwise excluded gift bridge without enabling the web,
      # broker or server feature, signing an app, or publishing an artifact.
      - name: Setup Node for native gift compile
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Prepare iOS simulator sources
        run: |
          npm ci
          npm run sync:ios

      - name: Compile experimental iOS gift bridge
        run: |
          xcodebuild \
            -project apps/web/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/operalibre-gift-compile" \
            'OTHER_SWIFT_FLAGS=$(inherited) -DOPERALIBRE_EXPERIMENTAL_GIFTS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  carplay:
    needs: changes
    if: needs.changes.outputs.carplay == 'true'
    name: CarPlay artwork
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test iOS CarPlay cover cache
        id: car_artwork
        run: python3 script/test_car_artwork.py

      - name: Upload failed CarPlay cover test results
        if: failure() && steps.car_artwork.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operalibre-carplay-cover-test-results
          path: output/car-artwork-tests/*.xcresult
          if-no-files-found: warn

  bookplayer:
    needs: changes
    if: needs.changes.outputs.bookplayer == 'true'
    name: BookPlayer compatibility
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust for BookPlayer contract test
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache BookPlayer contract build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/server

      - name: Check out pinned BookPlayer response models
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TortugaPower/BookPlayer
          ref: 154895b90b5b3612b77972923bd1d22fde49fffa
          path: .bookplayer-contract
          persist-credentials: false

      - name: Test BookPlayer Foundation URLs and response decoding over HTTP
        env:
          BOOKPLAYER_CHECKOUT: ${{ github.workspace }}/.bookplayer-contract
        run: cargo test --locked --manifest-path apps/server/Cargo.toml bookplayer_live_contract -- --ignored --nocapture

  macos:
    # Preserve the existing required check while covering selection failures and
    # every selected job, including the native checks split out above.
    name: macOS app (Swift)
    if: always()
    needs: [changes, server, server-windows, launcher, web, playback, android, apple, carplay, bookplayer]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success', 'Change selection failed'
          for name, job in results.items():
              selected = results['changes']['outputs'].get(name.replace('-', '_')) == 'true'
              allowed = ('success',) if selected or name == 'changes' else ('success', 'skipped')
              assert job['result'] in allowed, f'{name}: {job["result"]}'
          PYTHON
