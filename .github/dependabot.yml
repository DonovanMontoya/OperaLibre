version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/server
    schedule:
      interval: weekly
    groups:
      server-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/launcher
    schedule:
      interval: weekly
    groups:
      launcher-dependencies:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /apps/web/android
    schedule:
      interval: weekly
    groups:
      android-dependencies:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns: ["*"]
