name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. If you plan to build it yourself, agree on the approach here before opening a pull request.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: I listen on two phones and want downloads to follow me without re-downloading each book.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like OperaLibre to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other approaches you considered, or how you work around it now.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, with guidance on the approach"
        - "Maybe"
        - "No"
    validations:
      required: true
