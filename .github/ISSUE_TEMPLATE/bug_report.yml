name: Bug report
description: Report broken behavior, regressions, crashes, or lost progress.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first and keep the report focused on one problem.
        For installation and connection problems, the [troubleshooting guide](https://donovanmontoya.github.io/OperaLibre/troubleshooting.html) may already have the answer.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I included enough detail to reproduce or investigate the problem.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of OperaLibre is affected?
      options:
        - Server (scanning, streaming, accounts, API)
        - Web app
        - iPhone or CarPlay app
        - Android app
        - macOS app
        - Installer, launcher, or updates
        - Playback progress or sync
        - Read-along or companion files
        - Audible or Libro.fm import
        - Jellyfin connection
        - Third-party client (Audiobookshelf-compatible or OPDS)
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1. Start playing a book on the iPhone app
        2. Lock the phone and wait five minutes
        3. Open the same book on the web app
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The web app resumes where the phone stopped.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The web app starts from 0:00 and the phone's position is overwritten.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is this in practice?
      options:
        - Lost progress or data
        - Can't listen at all
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OperaLibre version
      description: Shown under Administration → Software versions, or the release or commit you installed.
      placeholder: 1.4.2, or main @ abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Server OS and install type, deployment mode, how clients connect, and the client and its version.
      placeholder: |
        Server: Ubuntu 24.04, combined package, lan mode
        Connection: Tailscale
        Client: iPhone app 1.2.0 on iOS 19.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from `data/server.log` or the server console. Remove passwords, tokens, server addresses, and personal library details.
      render: shell

  - type: upload
    id: attachments
    attributes:
      label: Screenshots or recordings
      description: Remove personal library contents, server addresses, and account names before uploading.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm,.log,.txt,.json"

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a temporary workaround, describe it.
